<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Payment</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h3>Manage Payment</h3>
  <hr>
  <div class="card col-md-6 p-0">
    <div class="card-header bg-dark text-white">
      Payment Info
    </div>
    <div class="card-body">
      <p><strong>Payment ID:</strong> <span th:text="${payment.id}"></span></p>
      <p><strong>Method:</strong> <span th:text="${payment.method}"></span></p>
      <p><strong>Current Status:</strong>
        <span th:classappend="${payment.status == 'SUCCESS' ? 'badge-success' : (payment.status == 'REJECTED' ? 'badge-danger' : 'badge-warning')}"
              class="badge" th:text="${payment.status}"></span>
      </p>

      <hr>

      <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post" class="mt-3">
        <p class="font-weight-bold">Change Status:</p>
        <button type="submit" name="status" value="SUCCESS" class="btn btn-success mr-2"
                th:disabled="${payment.status == 'SUCCESS'}">Accept Payment</button>

        <button type="submit" name="status" value="REJECTED" class="btn btn-danger"
                th:disabled="${payment.status == 'REJECTED'}">Reject Payment</button>
      </form>
    </div>
  </div>

  <a th:href="@{/payment/admin/list}" class="btn btn-secondary mt-3">Back to List</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
