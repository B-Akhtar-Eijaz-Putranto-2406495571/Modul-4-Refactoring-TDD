<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Payments - Admin</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>All Payments (Admin Dashboard)</h2>
    <hr>
    <table class="table table-striped table-bordered table-responsive-md mt-3">
        <thead class="thead-dark">
        <tr>
            <th scope="col">Payment ID</th>
            <th scope="col">Method</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="payment : ${payments}">
            <td th:text="${payment.id}"></td>
            <td th:text="${payment.method}"></td>
            <td>
                    <span th:classappend="${payment.status == 'SUCCESS' ? 'badge-success' : (payment.status == 'REJECTED' ? 'badge-danger' : 'badge-warning')}"
                          class="badge" th:text="${payment.status}"></span>
            </td>
            <td>
                <a th:href="@{/payment/admin/detail/{id}(id=${payment.id})}" class="btn btn-sm btn-info">Manage</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="4" class="text-center">No payments found.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
